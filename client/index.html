<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <!-- Primary Meta Tags -->
    <title>Joblify - Find Freelance Jobs on Reddit & X (Twitter) with AI</title>
    <meta name="title" content="Joblify - Find Freelance Jobs on Reddit & X (Twitter) with AI" />
    <meta name="description" content="Stop scrolling, start earning! Joblify uses AI to scan Reddit and X (Twitter) for freelance opportunities matching your skills. Get instant job alerts before anyone else." />
    <meta name="keywords" content="freelance jobs, reddit jobs, twitter jobs, x jobs, AI job matching, freelance marketplace, remote work, gig economy" />
    <link rel="canonical" href="https://joblify.app/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://joblify.app/" />
    <meta property="og:title" content="Joblify - Find Freelance Jobs on Reddit & X (Twitter) with AI" />
    <meta property="og:description" content="Stop scrolling, start earning! Joblify uses AI to scan Reddit and X for freelance opportunities matching your skills." />
    <meta property="og:image" content="https://joblify.app/og-image.png" />
    <meta property="og:site_name" content="Joblify" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://joblify.app/" />
    <meta name="twitter:title" content="Joblify - Find Freelance Jobs on Reddit & X with AI" />
    <meta name="twitter:description" content="Stop scrolling, start earning! AI-powered freelance job matching from social media." />
    <meta name="twitter:image" content="https://joblify.app/og-image.png" />
    
    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Joblify",
      "description": "AI-powered freelance job discovery platform that scans Reddit and X (Twitter) for opportunities matching your skills",
      "url": "https://joblify.app/",
      "applicationCategory": "BusinessApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "127"
      }
    }
    </script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
