<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <!-- Primary Meta Tags -->
    <title>Joblify - AI Resume Builder | ATS-Optimized Resume Creator</title>
    <meta name="title" content="Joblify - AI Resume Builder | ATS-Optimized Resume Creator" />
    <meta name="description" content="Create professional, ATS-optimized resumes with Joblify's AI-powered resume builder. Build your resume through natural conversation, scan for ATS compatibility, and generate tailored cover letters. Free resume maker with instant PDF export." />
    <meta name="keywords" content="AI resume builder, ATS resume scanner, resume maker, professional resume, resume builder free, ATS optimized resume, cover letter generator, resume creator, AI resume, resume templates, job application" />
    <link rel="canonical" href="https://joblify.app/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://joblify.app/" />
    <meta property="og:title" content="Joblify - AI Resume Builder | Create ATS-Optimized Resumes" />
    <meta property="og:description" content="Build professional resumes with AI assistance. Create ATS-optimized resumes through natural conversation, scan for compatibility, and generate tailored cover letters." />
    <meta property="og:image" content="https://joblify.app/og-image.png" />
    <meta property="og:site_name" content="Joblify" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://joblify.app/" />
    <meta name="twitter:title" content="Joblify - AI Resume Builder | ATS-Optimized" />
    <meta name="twitter:description" content="Create professional, ATS-optimized resumes with AI. Free resume builder with instant PDF export." />
    <meta name="twitter:image" content="https://joblify.app/og-image.png" />
    
    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Joblify",
      "description": "AI-powered resume builder that creates ATS-optimized resumes through natural conversation. Build professional resumes, scan for ATS compatibility, and generate tailored cover letters.",
      "url": "https://joblify.app/",
      "applicationCategory": "BusinessApplication",
      "applicationSubCategory": "Resume Builder",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "100"
      },
      "featureList": [
        "AI-powered resume building",
        "ATS compatibility scanner",
        "Conversational resume creation",
        "Cover letter generator",
        "PDF and DOCX export",
        "Resume tailoring for specific jobs",
        "LinkedIn import"
      ]
    }
    </script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>
