<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- Primary Meta Tags -->
    <title>Joblify - Find Freelance Jobs From Reddit, X & Social Media | AI-Powered Job Matching</title>
    <meta name="title" content="Joblify - Find Freelance Jobs From Reddit, X & Social Media | AI-Powered Job Matching" />
    <meta name="description" content="Stop scrolling, start earning! Joblify automatically finds freelance opportunities from Reddit, X (Twitter), and social media that match your skills. AI-powered job discovery and outreach for freelancers, developers, designers, and remote workers." />
    <meta name="keywords" content="freelance jobs, remote work, find freelance gigs, freelance opportunities, Reddit jobs, Twitter jobs, X jobs, social media jobs, AI job matching, freelance platform, remote jobs, gig economy, freelance developer, freelance designer, work from home, job aggregator" />
    <meta name="author" content="Joblify" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://joblify.app/" />
    <meta property="og:title" content="Joblify - Find Freelance Jobs From Reddit, X & Social Media" />
    <meta property="og:description" content="Discover freelance opportunities before anyone else. AI-powered job matching and outreach from Reddit, X (Twitter), and social media platforms." />
    <meta property="og:image" content="https://joblify.app/og-image.png" />
    <meta property="og:site_name" content="Joblify" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://joblify.app/" />
    <meta name="twitter:title" content="Joblify - Find Freelance Jobs From Reddit, X & Social Media" />
    <meta name="twitter:description" content="Stop scrolling, start earning! AI-powered freelance job discovery from Reddit, X, and social media." />
    <meta name="twitter:image" content="https://joblify.app/twitter-card.png" />
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Joblify",
      "description": "AI-powered freelance job discovery platform that finds opportunities from Reddit, X (Twitter), and social media",
      "url": "https://joblify.app",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "150"
      }
    }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
